[package]
name = "shr-desk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "GigPies operator surface: offline control and full-HD layout prototype"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"


[features]
default = []
native = ["dep:winit", "dep:wgpu", "dep:pollster"]

[dependencies.winit]
version = "=0.30.12"
optional = true
default-features = false
features = ["x11", "rwh_06"]

[dependencies.wgpu]
version = "=0.20.1"
optional = true
default-features = false
features = ["wgsl"]

[dependencies.pollster]
version = "=0.3.0"
optional = true
