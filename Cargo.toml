[package]
name = "shr-desk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "GigPies operator surface: offline control and full-HD layout prototype"
license = "MIT"
publish = false

[dependencies]
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "sync", "io-util"] }


[features]
default = []
native = ["dep:winit", "dep:wgpu", "dep:pollster"]

[dependencies.winit]
version = "=0.30.12"
optional = true
default-features = false
features = ["x11", "rwh_06"]

[dependencies.wgpu]
version = "=0.20.1"
optional = true
default-features = false
features = ["wgsl"]

[dependencies.pollster]
version = "=0.3.0"
optional = true
